<!doctype html>
<html>
  <head>
    <title>Site</title>
  <style id="navbar-force-style">

      /* Always force top navigation bar to SPX blue #0089ce */
      #app-bar-toolbar,
      .app-bar-toolbar,
      .ui-header-fixed.app-bar-toolbar,
      div#app-bar-toolbar.ui-bar-a {
        background-color: #0089ce !important;
        background: #0089ce !important;
        background-image: none !important;
        border-color: #0089ce !important;
      }
      #app-bar-toolbar .app-logo,
      .app-bar-toolbar .app-logo,
      #app-bar-toolbar .ui-title,
      .app-bar-toolbar .ui-title,
      #app-bar-toolbar #app-btn-menu,
      .app-bar-toolbar #app-btn-menu,
      #app-bar-toolbar .app-btn,
      .app-bar-toolbar .app-btn,
      #app-bar-toolbar .app-icon,
      .app-bar-toolbar .app-icon {
        color: #ffffff !important;
      }
      .app-menu-strip ul li .ui-btn,
      .app-menu-strip ul li a,
      .app-menu-strip .ui-btn:not(.ui-btn-active),
      body:not(.app-hosted) .app-bar-toolbar .app-menu-strip .ui-btn:not(.ui-btn-active),
      body:not(.app-hosted) .ui-bar-a .app-menu-strip .ui-btn:not(.ui-btn-active) {
        color: #ffffff !important;
        opacity: 1 !important;
      }
      .app-menu-strip ul li .ui-btn.app-selected,
      .app-menu-strip ul li .ui-btn.app-selected:not(.ui-btn-active),
      body:not(.app-hosted) .ui-bar-a .app-menu-strip .ui-btn.app-selected:not(.ui-btn-active),
      .ui-bar-a .app-menu-strip .ui-btn.app-selected:not(.ui-btn-active) {
        background-color: rgba(0, 0, 0, 0.2) !important;
        color: #ffffff !important;
      }
      .app-menu-strip ul li .ui-btn:hover:not(.ui-btn-active) {
        background-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
      }
      /* Hide watermark & trial copyright */
      .app-acc-footer, .app-copyright, #PageFooterBar, footer, footer small {
        display: none !important;
        visibility: hidden !important;
      }
      /* Hide header banner on Report Issue */
      .pages_report_issue_html .app-page-header,
      #pages-report-issue .app-page-header,
      .ui-page:has(.ri-root-container) .app-page-header {
        display: none !important;
      }
      /* Hide action bar and echo toolbar on Home screen */
      #view1_echo .app-echo-toolbar,
      #view2_echo .app-echo-toolbar,
      .HomePage .app-echo-toolbar,
      .pages_home_html .app-echo-toolbar {
        display: none !important;
      }

</style>
  </head>
  <body>
    <div id="PageHeader">
      <div id="PageHeaderBar">
        <div data-role="placeholder" data-placeholder="page-header">DWG GEN AUTOMATION ADMIN DASHBOARD</div>
      </div>
      <div data-role="placeholder" data-placeholder="menu-bar" class="PageMenuBar" data-hover-style="Auto" data-popup-position="Left" data-show-site-actions="true"> </div>
    </div>
    <table id="PageBody">
      <tr>
        <td id="PageHeaderSideBar"><img class="PageLogo" alt="logo"></td>
        <td id="PageHeaderLeftSide"><span class="placeholder"> </span></td>
        <td id="PageHeaderContent">
          <div class="Header">
            <div data-role="placeholder" data-placeholder="site-map-path"> </div>
            <div class="Title">
              <div data-role="placeholder" data-placeholder="page-title">Page Title</div>
            </div>
          </div>
        </td>
        <td id="PageHeaderRightSide"><span class="placeholder"> </span></td>
      </tr>
      <tr>
        <td id="PageContentSideBar">
          <div class="SideBarBody">
            <div data-role="placeholder" data-placeholder="page-side-bar"> </div><span class="placeholder"> </span></div>
        </td>
        <td id="PageContentLeftSide"><span class="placeholder"> </span></td>
        <td id="PageContent">
          <div data-role="placeholder" data-placeholder="page-content"> </div>
        </td>
        <td id="PageContentRightSide"><span class="placeholder"> </span></td>
      </tr>
      <tr>
        <td id="PageFooterSideBar"><span class="placeholder"> </span></td>
        <td id="PageFooterLeftSide"><span class="placeholder"> </span></td>
        <td id="PageFooterContent"><span class="placeholder"> </span></td>
        <td id="PageFooterRightSide"><span class="placeholder"> </span></td>
      </tr>
    </table>
    <div id="PageFooterBar">
      <div data-role="placeholder" data-placeholder="page-footer">  </div>
    </div>
  </body>
</html>
